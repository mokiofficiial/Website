<script src="projects.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
dlPaint();

var id=new URLSearchParams(location.search).get("id");
var i=P.findIndex(function(p){return p.id===id});
var d=$("d");

if(i<0){
 document.title="Not found — MOKI";
 d.innerHTML='<div class="dhead"><h2>Project not found</h2></div>'
  +'<p class="dlede">That project does not exist, or the link is incomplete.</p>'
  +'<p style="margin-top:20px"><a class="btn" href="projects.html">Browse all projects</a></p>';
 $("prev").style.visibility="hidden";$("next").style.visibility="hidden";
}else{
 var p=P[i],n=(i+1)%P.length,pv=(i-1+P.length)%P.length;
 document.title=p.n+" — MOKI Projects";
 document.querySelector('meta[name=description]').setAttribute("content",p.d);
 d.innerHTML='<div class="dhead"><span class="chip"><i class="dot"></i>'+p.c+(p.live?"":" &middot; SOON")+'</span>'
  +'</div>'
  +'<h2 style="margin:10px 0 10px;font:800 clamp(28px,5vw,46px)/1.05 Syne,sans-serif;color:var(--fg)">'+p.n+'</h2>'
  +'<p class="dlede">'+p.d+'</p>'
  +'<dl class="dsec">'
  +'<dt>Design objective</dt><dd>'+p.o+'</dd>'
  +'<dt>Highlights</dt><dd>'+p.f+'</dd>'
  +'<dt>Credit</dt><dd>Created by MOKI</dd>'
  +'<dt>License</dt><dd>'+(p.live?'Free download. License terms are stated on the download page.':'Announced at release.')+'</dd>'
  +'</dl>'
  +'<div class="row">'+(p.live?'<button class="btn" id="get">Get it free</button>':'<button class="btn" disabled style="opacity:.5;cursor:not-allowed">Coming soon</button>')+'</div>';
 $("prev").textContent="\u2190 "+P[pv].n;$("prev").href="?id="+P[pv].id;
 $("next").textContent=P[n].n+" \u2192";$("next").href="?id="+P[n].id;
 if(p.live)$("get").onclick=dlAdd;
}
</script>
</body>
</html>
