<script>
var $=function(i){return document.getElementById(i)};
renderCards("cards",P);dlPaint();
document.documentElement.classList.add("js");
var rvs=[].slice.call(document.querySelectorAll(".rv,.pc"));
rvs.forEach(function(el,i){el.classList.add("rv");el.style.setProperty("--d",(i%4)*.09+"s")});
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var el=e.target;el.classList.add("in");io.unobserve(el);setTimeout(function(){el.classList.remove("rv","in");el.style.removeProperty("--d")},1100)}})},{threshold:.12});
rvs.forEach(function(el){io.observe(el)});
</script>
